# Baseline Model Configuration
# Models to evaluate in the SLM Agent Benchmark
# Intent-Driven Slice Lifecycle Management in 6G Core

baselines:
  # Group 1: Legacy (Rule-based)
  - id: "rule_based"
    name: "Regex Rule-Based Parser"
    group: "Legacy"
    type: "rule_based"
    description: "Python regex-based intent parser — traditional approach"
    serving:
      provider: null
      endpoint: null
      model: null
    expected_parameters_billions: null
    notes: "Proves that traditional string-matching fails on flexible/ambiguous natural language"

  # Group 2: Tiny SLMs
  - id: "qwen2.5-1.5b"
    name: "Qwen2.5-1.5B-Instruct"
    group: "Tiny SLM"
    type: "slm"
    serving:
      provider: "ollama"
      model: "qwen2.5:1.5b"
      quantization: "q4_K_M"
    expected_parameters_billions: 1.5
    expected_ram_gb: 2
    expected_power_watts: 50

  - id: "gemma2-2b"
    name: "Gemma-2-2B-Instruct"
    group: "Tiny SLM"
    type: "slm"
    serving:
      provider: "ollama"
      model: "gemma2:2b"
      quantization: "q4_K_M"
    expected_parameters_billions: 2
    expected_ram_gb: 2.5
    expected_power_watts: 60

  - id: "llama3.2-3b"
    name: "Llama-3.2-3B-Instruct"
    group: "Tiny SLM"
    type: "slm"
    serving:
      provider: "ollama"
      model: "llama3.2:3b"
      quantization: "q4_K_M"
    expected_parameters_billions: 3
    expected_ram_gb: 3
    expected_power_watts: 70

  # Group 3: Mid-size SLMs
  - id: "mistral-7b"
    name: "Mistral-v0.3-7B-Instruct"
    group: "Mid SLM"
    type: "slm"
    serving:
      provider: "ollama"
      model: "mistral:7b"
      quantization: "q4_K_M"
    expected_parameters_billions: 7
    expected_ram_gb: 6
    expected_power_watts: 150

  - id: "llama3.1-8b"
    name: "Llama-3.1-8B-Instruct"
    group: "Mid SLM"
    type: "slm"
    serving:
      provider: "ollama"
      model: "llama3.1:8b"
      quantization: "q4_K_M"
    expected_parameters_billions: 8
    expected_ram_gb: 7
    expected_power_watts: 160

  - id: "qwen2.5-7b"
    name: "Qwen2.5-7B-Instruct"
    group: "Mid SLM"
    type: "slm"
    serving:
      provider: "ollama"
      model: "qwen2.5:7b"
      quantization: "q4_K_M"
    expected_parameters_billions: 7
    expected_ram_gb: 6
    expected_power_watts: 150

  - id: "phi3-14b"
    name: "Phi-3-Medium-14B-Instruct"
    group: "Mid SLM"
    type: "slm"
    serving:
      provider: "ollama"
      model: "phi3:14b"
      quantization: "q4_K_M"
    expected_parameters_billions: 14
    expected_ram_gb: 12
    expected_power_watts: 250

  # Group 4: Cloud LLM (Upper Bound)
  - id: "gpt-4o"
    name: "GPT-4o"
    group: "Cloud LLM"
    type: "llm"
    serving:
      provider: "openai"
      model: "gpt-4o"
    expected_parameters_billions: null
    expected_ram_gb: null
    expected_power_watts: null
    notes: "Upper bound — cloud-based frontier model"

  - id: "claude-sonnet-4"
    name: "Claude Sonnet 4"
    group: "Cloud LLM"
    type: "llm"
    serving:
      provider: "anthropic"
      model: "claude-sonnet-4-20250514"
    expected_parameters_billions: null
    expected_ram_gb: null
    expected_power_watts: null
    notes: "Alternative upper bound"

# Experiment settings
experiment:
  iterations_per_intent: 5        # Run each intent 5-10 times per model
  warmup_iterations: 1            # Discard first run for cold-start mitigation
  timeout_per_intent_seconds: 60  # Max time per intent
  random_seed: 42

# Scoring weights for final ranking
scoring:
  format_accuracy_weight: 0.25     # Can the model produce valid JSON?
  parameter_match_weight: 0.35     # Are the values correct?
  reasoning_score_weight: 0.25     # LLM-as-a-Judge for ambiguous intents
  convergence_time_weight: 0.10   # How fast is the end-to-end response?
  energy_efficiency_weight: 0.05   # Joules per intent
